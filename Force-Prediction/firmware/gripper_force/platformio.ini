; Force-controlled gripper firmware for ground-truth collection.
; Exposes a newline-terminated serial protocol at 9600 baud consumed by
; force_prediction.hardware.SerialGripper:
;
;   SET_FORCE <n>   set the target stationary-finger normal force (newtons)
;   CLOSE           close until initial contact
;   OPEN            fully open / release
;   READ            -> prints the current load-cell force in newtons
;   LIFT            run the standardized lift; -> "HELD" or "DROPPED"
;
; NOTE: pin map, actuator type, and control gains are hardware-specific and must
; be set on-site. This sketch is structured and commented for that bring-up.

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
lib_deps =
    bogde/HX711 @ ^0.7.5
