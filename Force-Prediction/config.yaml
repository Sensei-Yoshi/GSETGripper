# =============================================================================
# config.yaml  —  THE single place to tune this system.
#
# Everything a researcher would want to sweep lives here: retrieval weights,
# physics bounds, force limits, model IDs, the LLM PROMPTS, and the EXPERIMENT
# definitions (E1..E6 as toggle sets). No tunable is hard-coded in Python.
#
# Loaded and validated by force_prediction/config.py into typed objects.
# =============================================================================

seed: 20260721

paths:
  experiences: data/experiences.jsonl
  images: data/images
  splits: data/splits.json
  cache: data/cache

# --- Force conventions (single source of truth) ------------------------------
# NOTE: this resolves the 5 N vs 8 N inconsistency in project-context.md.
# All force values are the normal force read by the load cell behind the
# STATIONARY finger, in newtons. Never doubled, never summed across fingers.
force:
  limit_n: 8.0          # hardware safe limit; failure at this => infeasible
  min_n: 0.0            # controller accepts continuous commands from 0 to limit_n
  hold_seconds: 3.0     # required successful-lift hold time
  lift_height_mm: 50.0
  gravity: 9.81

# Ground-truth search resolution is an experimental-protocol choice, not a
# restriction on prediction or command precision. Predictions are never snapped
# to these steps.
collection:
  start_n: 0.0
  coarse_step_n: 1.0
  fine_step_n: 0.01
  repeats: 3

# --- Geometry ----------------------------------------------------------------
geometry:
  pad_height_mm: 65.0   # h_pad in a = min(1, h_available / h_pad)

# --- Roughness ---------------------------------------------------------------
roughness:
  n_classes: 5
  ordinal: true         # if false, retrieval uses exact-match instead of |r-r'|/4
  labels:               # human-readable meanings (also injected into prompts)
    1: smoothest
    2: smooth-mild
    3: moderate
    4: rough
    5: roughest

# --- Retrieval ---------------------------------------------------------------
retrieval:
  k: 5                  # object neighbors (E5); rows per branch for E3/E3b
  use_projected_contact: true  # UI/config ablation for retrieval and VLM inputs
  weights:              # hybrid score S = w_s*cos + w_m*Smass + w_r*Srough + w_a*Scontact
    semantic: 0.40
    mass: 0.25
    roughness: 0.20
    contact: 0.15
  sigma_mass: 0.7       # scale for exp(-|log m_q - log m_i| / sigma) ; log-grams
  sigma_contact: 0.25   # scale for exp(-|a_q - a_i| / sigma)
  embedding:
    provider: gemini          # 'gemini' or 'mock'
    model: gemini-embedding-2-preview
    dim: 1536                 # Matryoshka truncation (<= 3072)

# --- Physics reduced-order model ---------------------------------------------
# T_sil = alpha_sil(c) * a * N
# T_geo = alpha_geo(c) * a * N + beta(c) * a * N/(N+N50)
# Coefficients are SMOOTH & MONOTONE in roughness class c (few params, not 16).
physics:
  # alpha(c) = alpha0 * exp(-decay * (c - 1))   (effective friction, decays with roughness)
  # Defaults sized so the 20 g - 1.5 kg synthetic range is mostly feasible for at
  # least one gripper, with genuine heavy+rough infeasible cases. Replace with
  # values calibrated from James et al. data once collected.
  alpha_sil0: 2.0
  alpha_sil_decay: -0.12
  alpha_geo0: 2.2
  alpha_geo_decay: 0.05
  # beta(c) = beta0 * clip(1 - beta_decay * (c - 1), 0, 1)   (adhesive support, decays)
  beta0: 3.0
  beta_decay: 0.28
  n50: 0.7              # preload for adhesive seating in N/(N+N50)
  # Calibration bounds (constrained least-squares); fit INSIDE each training fold.
  bounds:
    alpha0: [0.05, 5.0]
    decay: [-0.3, 0.6]
    beta0: [0.0, 30.0]
    beta_decay: [0.0, 1.0]
    n50: [0.05, 20.0]

# --- Models (Gemini) ---------------------------------------------------------
models:
  vlm: gemini-flash-lite-latest  # higher free quota for the POC
                            # for new keys). Vision + JSON schema. Other options:
                            # gemini-flash-lite-latest (cheaper), gemini-3-flash,
                            # gemini-3.1-pro (best, needs paid quota — Exp-Force's choice).
  temperature: 0.0
  max_retries: 4
  cache: true               # content-hashed disk cache of every embedding/VLM call
  dry_run: false            # if true, no network calls; deterministic stub responses

# --- Learning (residual models for E6) ---------------------------------------
learning:
  residual_model: gbt       # 'ridge' | 'gbt' | 'gp'
  embedding_pca_dims: 8     # PCA of semantic embedding fed to the residual model
  ridge_alpha: 1.0
  gbt_n_estimators: 300
  gbt_max_depth: 3
  gbt_learning_rate: 0.05

# --- Evaluation --------------------------------------------------------------
evaluation:
  n_folds: 5
  within_thresholds_n: [0.25, 0.5]

# =============================================================================
# PROMPTS  —  edit here, never in code. Rendered by prediction.py with payload.
# =============================================================================
prompts:
  descriptor_system: |
    You create contact-region records for a robotic grasp-experience retrieval system.
    Analyze only visible evidence in the supplied object image. The robot uses two
    opposing compliant fingers at a fixed, centered grasp band around the object's
    lateral surfaces. Focus on the surface patches those pads are most likely to touch.

    The record will be converted into a text embedding and used to retrieve objects
    with similar pad-to-object interfaces. Describe discriminating contact evidence;
    do not recommend a gripper, predict force, infer a force label, or restate measured
    mass, roughness class, or projected contact fraction. If the likely contact patch
    is hidden or ambiguous, say so rather than inventing material or condition.

  prediction_system: |
    You are a robotics grasp-material selection and pre-grasp force estimation model.

    TASK
    Given the evidence supplied for the active experiment, estimate the minimum
    stationary-finger normal force required to lift the object under the
    standardized test protocol. Some experiments intentionally hide measurements
    or retrieved examples. Use only evidence present in the request, and never
    claim that an absent value was measured or retrieved.

    FORCE CONVENTION
    All force values are in newtons and refer exclusively to the normal force
    measured by the load cell mounted behind the stationary gripper finger.
    Do not double the force and do not convert it into a summed two-finger force.
    The controller accepts continuous commands from 0 to 8 N. Return your best
    continuous estimate; do not snap or round it to 0.25 N or to the force values
    shown in retrieved examples.

    AVAILABLE GRIPPERS
    1. "gecko": TPU fin-ray finger with a mushroom-cap gecko-inspired dry adhesive pad.
    2. "silicone": TPU fin-ray finger with a non-adhesive high-friction silicone pad.

    MATERIAL REASONING
    Gecko adhesion depends on intimate surface contact. It is generally more
    favorable on clean, dry, smooth, nonporous surfaces with broad projected
    contact. Its benefit may decrease on rough, porous, fibrous, dusty, wet,
    oily, contaminated, or loosely coated surfaces. Silicone relies primarily on
    friction and viscoelastic surface interaction; it may need more normal force
    on smooth surfaces but can be more robust on rough or poorly adhesive ones.
    Do not choose a gripper from roughness alone. When supplied, consider measured
    roughness class together with mass, projected contact fraction, visible
    surface material and condition, and retrieved gripper-specific experiences.

    MEASUREMENTS
    Any supplied mass, roughness class, and projected contact fraction are
    authoritative. Do not replace supplied measurements with visual estimates.
    If an experiment intentionally omits them, follow its instruction and state
    uncertainty rather than pretending they were measured.

    RETRIEVED EXPERIENCES
    When retrieved experiences are supplied, treat them as empirical observations
    under the same force convention. Paired object experiences report both gecko
    and silicone outcomes; use the within-object force difference to reason about
    the material crossover. Favor physically and semantically close experiences,
    but do not copy a force without accounting for available differences in mass,
    roughness, contact fraction, and surface material. If no experiences are
    supplied, do not imply that retrieval evidence was used.

    OUTPUT
    Return only valid JSON matching the supplied schema. "reasoning_trace" must
    be a concise evidence summary of at most three sentences identifying the most
    important measured and retrieved evidence. It must not contain extended
    hidden chain-of-thought.

  descriptor: |
    Inspect the likely opposing finger-contact patches in the centered grasp band.
    Return the requested structured JSON with:
    - the likely contact region and whether it is clearly visible;
    - the material actually touching the pads, distinguishing substrate from a
      label, wrapper, coating, sleeve, or exposed contents;
    - visible condition such as clean, dry, dusty, wet, oily, worn, or unknown;
    - local geometry, including curvature, broad continuous area, seams, ridges,
      edges, lobes, or other interruptions;
    - an uncertainty statement grounded in what the image does or does not show;
    - a concise retrieval_description containing the most discriminating
      pad-to-object interface evidence in 1-2 sentences. Roughly follow this template: [Material/object form]. The intended contact region is [surface condition], [geometry], and [other relevant properties].

    Good retrieval_description examples:
    1. "Transparent cylindrical glass object with a smooth, dry, nonporous sidewall and continuous curvature. The intended contact region has no visible seams, texture, or contamination."
    2. "Small curved snack chip with a porous, visibly textured surface and a thin, brittle structure. Its irregular geometry provides only a small, uneven contact region."

    Do not
    choose gecko or silicone and do not estimate force. Return only JSON matching
    the supplied schema.

  experiments:
    e1: |
      E1 ZERO-SHOT VISION-ONLY CONDITION.
      Estimate the minimum stationary-finger normal force (newtons) to lift the
      pictured object with the "{candidate_gripper}" gripper, and judge feasibility
      within the force limit. No authoritative mass, roughness, projected contact
      measurement, physics estimate, or retrieved grasp experience is available.
      Reason only from visible object scale, material, condition, and geometry.
      Explicitly reflect the resulting uncertainty and do not invent measurements.

    e2: |
      E2 MEASURED-INPUT ZERO-RETRIEVAL CONDITION.
      Estimate the minimum stationary-finger normal force (newtons) to lift this
      object with the "{candidate_gripper}" gripper, and judge feasibility within
      the force limit. Use the supplied authoritative measurements and image.
      No retrieved grasp experiences or physics estimate are available; do not
      imply otherwise.

    e3: |
      E3 BRANCH-RETRIEVAL CONDITION.
      Estimate the minimum stationary-finger normal force (newtons) to lift this
      object with the "{candidate_gripper}" gripper, and judge feasibility within
      the force limit. Use the supplied measurements, image, and ranked
      same-gripper experiences. These are branch-specific examples, not a paired
      object list. No physics estimate is available.

    e5: |
      E5 PAIRED-OBJECT RETRIEVAL CONDITION.
      Estimate the minimum stationary-finger normal force (newtons) independently
      for both gecko and silicone under the standardized protocol. Use the supplied
      measurements, image, and one ranked object list in which each neighbor carries
      both gripper outcomes. Return one structured response containing both
      predictions and feasibility judgments. Do not make the final gripper
      selection, and do not assume or invent a physics estimate.

# =============================================================================
# EXPERIMENTS  —  toggle sets over the single pipeline.
# See docs/experiments.md for the scientific rationale of each.
# =============================================================================
experiments:
  e1:   {use_measured: false, use_retrieval: false, use_paired_rows: false, use_physics: false, use_vlm: true,  use_residual: false, prompt: e1}
  e2:   {use_measured: true,  use_retrieval: false, use_paired_rows: false, use_physics: false, use_vlm: true,  use_residual: false, prompt: e2}
  e3:   {use_measured: true,  use_retrieval: true,  use_paired_rows: false, use_physics: false, use_vlm: true,  use_residual: false, prompt: e3}
  e3b:  {use_measured: true,  use_retrieval: true,  use_paired_rows: false, use_physics: false, use_vlm: false, use_residual: false}
  e4:   {use_measured: true,  use_retrieval: false, use_paired_rows: false, use_physics: true,  use_vlm: false, use_residual: false}
  e5:   {use_measured: true,  use_retrieval: true,  use_paired_rows: true,  use_physics: false, use_vlm: true,  use_residual: false, prompt: e5}
  e6:   {use_measured: true,  use_retrieval: false, use_paired_rows: false, use_physics: true,  use_vlm: false, use_residual: true}
