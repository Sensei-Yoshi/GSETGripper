prompts:
  descriptor_system: 'You create contact-region records for a robotic grasp-experience
    retrieval system.

    Analyze only visible evidence in the supplied object image. The robot uses two

    opposing compliant fingers at a fixed, centered grasp band around the object''s

    lateral surfaces. Focus on the surface patches those pads are most likely to touch.


    The record will be converted into a text embedding and used to retrieve objects

    with similar pad-to-object interfaces. Describe discriminating contact evidence;

    do not recommend a gripper, predict force, infer a force label, or restate measured

    mass, roughness class, or projected contact fraction. If the likely contact patch

    is hidden or ambiguous, say so rather than inventing material or condition.

    '
  prediction_system: 'You are a robotics grasp-material selection and pre-grasp force
    estimation model.


    TASK

    Given the evidence supplied for the active experiment, estimate the minimum

    stationary-finger normal force required to lift the object under the standardized

    test protocol. Some experiments intentionally hide measurements or retrieved

    examples. Use only evidence present in the request, and never claim that an absent

    value was measured or retrieved.


    FORCE CONVENTION

    All force values are in newtons and refer exclusively to the normal force measured

    by the load cell mounted behind the stationary gripper finger. Do not double the

    force and do not convert it into a summed two-finger force. The controller accepts

    continuous commands from 0 to 8 N. Return your best continuous estimate.


    AVAILABLE GRIPPERS

    The request supplies fixed written descriptions for the Gecko and silicone gripper

    embodiments. Apply that context consistently to both candidate

    predictions.


    MATERIAL REASONING

    Gecko adhesion depends on intimate surface contact. It is generally more favorable

    on clean, dry, smooth, nonporous surfaces with broad projected contact. Its benefit

    may decrease on rough, porous, fibrous, dusty, wet, oily, contaminated, or loosely

    coated surfaces. Silicone relies primarily on friction and viscoelastic surface

    interaction; it may need more normal force on smooth surfaces but can be more
    robust

    on rough or poorly adhesive ones. Do not choose a gripper from roughness alone.


    MEASUREMENTS

    Any supplied mass, roughness class, and projected contact fraction are authoritative.

    If an experiment intentionally omits them, state uncertainty rather than pretending

    they were measured.


    RETRIEVED EXPERIENCES

    When retrieved experiences are supplied, treat them as empirical observations
    under

    the same force convention. Paired experiences report both Gecko and silicone outcomes.

    Use only comparison fields actually present in the request. If no experiences
    are

    supplied, do not imply that retrieval evidence was used.


    QUANTITATIVE JUSTIFICATION

    Use quantitative checks when the available evidence supports them. Do not invent

    calibrated friction, adhesion, or contact coefficients. Object weight may be used
    as

    a sanity check, but it is not itself the required gripper normal force.


    OUTPUT

    Return only valid JSON matching the supplied schema, including an explicit

    recommended_gripper. For each gripper, record every material piece of supplied
    or

    visible evidence in evidence_used, show equations/substitutions/scaling in

    calculation_summary, and list assumptions, missing evidence, and uncertainty in

    assumptions_and_uncertainty. reasoning_trace must connect those items to the force

    estimate in a detailed, auditable explanation. comparison_evidence and

    recommendation_summary must explain the decisive comparison and why the alternative

    requires more force or is infeasible. Do not return an unsupported number or omit

    evidence merely to keep the answer short.

    '
  descriptor: "Inspect the likely opposing finger-contact patches in the centered\
    \ grasp band.\nReturn the requested structured JSON with:\n- the likely contact\
    \ region and whether it is clearly visible;\n- the material actually touching\
    \ the pads, distinguishing substrate from a\n  label, wrapper, coating, sleeve,\
    \ or exposed contents;\n- visible condition such as clean, dry, dusty, wet, oily,\
    \ worn, or unknown;\n- local geometry, including curvature, broad continuous area,\
    \ seams, ridges,\n  edges, lobes, or other interruptions;\n- an uncertainty statement\
    \ grounded in what the image does or does not show;\n- a concise retrieval_description\
    \ containing the most discriminating\n  pad-to-object interface evidence in 1-2\
    \ sentences. Roughly follow this template: [Material/object form]. The intended\
    \ contact region is [surface condition], [geometry], and [other relevant properties].\n\
    \nGood retrieval_description examples:\n1. \"Transparent cylindrical glass object\
    \ with a smooth, dry, nonporous sidewall and continuous curvature. The intended\
    \ contact region has no visible seams, texture, or contamination.\"\n2. \"Small\
    \ curved snack chip with a porous, visibly textured surface and a thin, brittle\
    \ structure. Its irregular geometry provides only a small, uneven contact region.\"\
    \n\nDo not\nchoose gecko or silicone and do not estimate force. Return only JSON\
    \ matching\nthe supplied schema.\n"
  experiments:
    e1: 'E1 ZERO-SHOT VISION-ONLY CONDITION.

      From the object image and fixed gripper embodiment context, estimate the minimum

      stationary-finger normal force for both Gecko and silicone. No authoritative
      mass,

      roughness, projected contact measurement, physics estimate, or retrieved experience

      is available. Reason from visible scale, material, condition, and geometry and
      state

      uncertainty because those judgments are necessarily rough visual approximations.

      Do not invent physical constants or claim to run calibrated physics.

      '
    e2: 'E2 MEASURED-INPUT ZERO-RETRIEVAL CONDITION.

      Use the object image, fixed gripper embodiment context, and supplied authoritative

      measurements: mass, roughness, and projected contact fraction.

      No retrieved experience or physics estimate is available. Do not infer hidden

      friction or adhesion constants.

      '
    e3: 'E3 SEMANTIC-ONLY EXPERIENCE-CONDITIONED CONDITION.

      Use the object image, fixed gripper embodiment context, and the ranked semantic

      experience list to predict both forces. Neighbors were selected only by cosine

      similarity between semantic contact-region descriptions and provide paired Gecko

      and silicone outcomes. No authoritative query or neighbor mass, roughness, projected

      contact, hybrid physical score, or physics estimate is available. Do not imply
      that

      any omitted sensor value was measured or used.'
    e4: 'E4 SEMANTIC AND SENSOR-FUSION RETRIEVAL CONDITION.

      Use the object image, fixed gripper embodiment context, supplied authoritative

      measurements, and one hybrid-ranked paired-object list to estimate both forces.

      Explain how close paired outcomes and available mass/contact scaling support
      the

      estimates. No calibrated physics estimate is available; do not invent one.

      '
embodiments:
  gecko:
    description: TPU fin-ray finger with a mushroom-cap Gecko-inspired dry-adhesive
      pad. The compliant backing is intended to seat the pad against opposing object
      sidewalls; dry adhesion benefits from broad, intimate contact with clean, dry,
      smooth, nonporous surfaces and degrades with roughness, porosity, contamination,
      moisture, loose coatings, or interrupted contact.
  silicone:
    description: TPU fin-ray finger with a non-adhesive high-friction silicone pad.
      The compliant backing conforms to opposing object sidewalls while holding capacity
      arises mainly from friction and viscoelastic interaction; it can remain useful
      on rough or interrupted surfaces where dry adhesion is weak.
