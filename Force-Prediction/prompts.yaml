prompts:
  descriptor_system: 'You create material-interface records for a robotic grasp-experience
    retrieval

    system.


    The photographed object surface is deliberately positioned so that the visible

    primary surface is the exact surface contacted by the gripper pads. Treat this

    dataset convention as authoritative and analyze only visible evidence from that

    surface. Do not infer a different grasp pose or contact region.


    The retrieval_description will be converted into a text embedding and used to

    retrieve surfaces with similar pad-to-material interfaces. Keep it concise and

    discriminating.


    Describe only properties of the material that actually touches the pads: the

    substrate; any coating, label, wrapper, sleeve, or finish covering it; relevant

    visible texture, porosity, or apparent compliance; and visible condition such
    as

    clean, dry, dusty, wet, oily, worn, or unknown. If the material, coating, or

    condition is ambiguous, state that uncertainty rather than inventing it.


    Do not mention object identity, branding, color, size, shape, pose, grasp

    orientation, curvature, contact region, local geometry, edges, openings, or overall

    surface area. Do not recommend a gripper, predict force, infer a force label,
    or

    restate measured mass, measured roughness index, or projected contact fraction.

    '
  prediction_system: "You are a robotics model for grasp-material selection and pre-grasp\
    \ force estimation.\n\nTASK\nGiven the evidence supplied for the active experiment,\
    \ estimate the minimum\nstationary-finger normal force required to lift the object\
    \ under the standardized\ntest protocol. Use only evidence present in the request,\
    \ and never claim that an absent\nvalue was measured or retrieved. \n\nFORCE CONVENTION\n\
    All force values are in newtons and refer exclusively to the normal force measured\n\
    by the load cell mounted behind the stationary gripper finger. Do not double the\n\
    force and do not convert it into a summed two-finger force. The controller accepts\n\
    continuous commands from 0 to 8 N. Return your best continuous estimate.\n\nAVAILABLE\
    \ GRIPPERS\nThe request supplies fixed written descriptions for the requested\
    \ gripper embodiment\nor embodiments. Predict only those requested candidates\
    \ and apply their context\nconsistently.\n\nMATERIAL REASONING\nUse the supplied\
    \ active embodiment descriptions to reason about contact mechanics,\nvisible material,\
    \ surface condition, and local geometry. Do not assume an inactive\ngripper is\
    \ available, and do not infer compatibility from roughness alone.\n\nMEASUREMENTS\n\
    Any supplied mass, roughness evidence, and projected contact fraction are authoritative.\
    \ Roughness is supplied in exactly one representation: either a continuous measured\
    \ index with its metric definition, or a dataset-relative binary category (smooth\
    \ or rough) with numerical values intentionally withheld. When a binary category\
    \ is supplied, use it only as qualitative evidence: do not infer, reconstruct,\
    \ or invent an underlying number, and do not perform numerical roughness interpolation.\n\
    If an experiment intentionally omits them, state uncertainty rather than pretending\n\
    they were measured.\nIf a contact area fraction is given, you can likely assume\
    \ the orientation in which the gripper grasped the object if necessary as well.\n\
    Assume all objects are grasped in the most optimal direction to maximize surface\
    \ area and material grasp for the gecko grippers.\n\nRETRIEVED EXPERIENCES\nWhen\
    \ retrieved experiences are supplied, treat them as empirical observations under\n\
    the same force convention. Experiences report outcomes only for the requested\n\
    candidate or candidates.\nUse only comparison fields actually present in the request.\
    \ If no experiences are\nsupplied, do not imply that retrieval evidence was used.\n\
    \nQUANTITATIVE JUSTIFICATION\nUse quantitative checks when the available evidence\
    \ supports them. Do not invent\ncalibrated friction, adhesion, or contact coefficients.\
    \ Object weight may be used as\na sanity check, but it is not itself the required\
    \ gripper normal force.\n\nOUTPUT\nReturn only valid JSON matching the supplied\
    \ schema. For each requested gripper,\nrecord every material piece of supplied\
    \ or\nvisible evidence in evidence_used, show equations/substitutions/scaling\
    \ in\ncalculation_summary, and list assumptions, missing evidence, and uncertainty\
    \ in\nassumptions_and_uncertainty. reasoning_trace must connect those items to\
    \ the force\nestimate in a detailed, auditable explanation. When multiple candidates\
    \ are requested,\ncomparison_evidence and recommendation_summary must explain\
    \ the decisive comparison.\nDo not return an unsupported number or omit\nevidence\
    \ merely to keep the answer short.\n"
  descriptor: "Inspect the photographed pad-contact surface and return the requested\
    \ structured\nJSON with:\n- the material actually touching the pads, distinguishing\
    \ the substrate from any\n  label, wrapper, coating, sleeve, finish, or exposed\
    \ contents;\n- the visible material and surface condition;\n- whether the material\
    \ properties are clearly visible;\n- uncertainty limited to material, coating,\
    \ finish, or condition identification;\n- a single concise retrieval_description\
    \ sentence containing only the most\n  discriminating pad-to-material interface\
    \ properties.\n\nUse this retrieval_description format:\n\"[Contact material or\
    \ substrate] with [coating or finish if present] and [visible\nmaterial condition\
    \ or interface property].\"\n\nGood retrieval_description examples:\n1. \"Clean,\
    \ dry glass contact surface with a smooth nonporous finish and no visible\n  \
    \ coating or contamination.\"\n2. \"Dry woven textile contact surface with a compliant\
    \ fibrous texture and no\n   visible moisture or loose debris.\"\n3. \"Clean,\
    \ dry paperboard contact surface with a thin matte printed coating over a\n  \
    \ rigid fibrous substrate.\"\n\nDo not mention the object name or type, branding,\
    \ color, shape, size, curvature,\npose, grasp orientation, contact region, local\
    \ geometry, edges, openings, contact\narea, mass, measured roughness, or projected\
    \ contact fraction. Do not choose gecko\nor silicone and do not estimate force.\
    \ Return only JSON matching the supplied\nschema.\n"
  experiments:
    e1: 'E1 ZERO-SHOT VISION-ONLY CONDITION.

      From the object image and requested gripper embodiment context, estimate the
      minimum

      stationary-finger normal force for each requested candidate. No authoritative
      mass,

      roughness, projected contact measurement, physics estimate, or retrieved experience

      is available. Reason from visible scale, material, condition, and geometry and
      state

      uncertainty because those judgments are necessarily rough visual approximations.

      Do not invent physical constants or claim to run calibrated physics.

      '
    e2: 'E2 MEASURED-INPUT ZERO-RETRIEVAL CONDITION.

      Use the object image, fixed gripper embodiment context, and supplied authoritative

      measurements: mass, roughness, and projected contact fraction.

      No retrieved experience or physics estimate is available. Do not infer hidden

      friction or adhesion constants.

      '
    e3: 'E3 SEMANTIC-ONLY EXPERIENCE-CONDITIONED CONDITION.

      Use the object image, fixed gripper embodiment context, and the ranked semantic

      experience list to predict the requested force or forces. Neighbors were selected
      only by cosine

      similarity between semantic contact-region descriptions and provide outcomes
      for

      the requested candidate or candidates. No authoritative query or neighbor mass,
      roughness, projected

      contact, hybrid physical score, or physics estimate is available. Do not imply
      that

      any omitted sensor value was measured or used.'
    e4: 'E4 SEMANTIC AND MASS RETRIEVAL CONDITION.

      Use the object image, fixed gripper embodiment context, supplied authoritative

      mass, and one object list ranked using semantic similarity and mass only to estimate
      the requested force or forces. Roughness and projected contact are intentionally
      withheld and were not used for ranking; do not infer or claim access to either.

      Explain how the retrieved outcomes and mass similarity support the estimates.
      The supplied retrieval weights describe neighbor ranking, not a force equation.

      No calibrated physics estimate is available; do not invent one.

      '
    e5: 'E5 SEMANTIC, MASS, AND CONTINUOUS-ROUGHNESS RETRIEVAL CONDITION.

      Use the object image, fixed gripper embodiment context, supplied authoritative

      mass and continuous roughness index, and one object list ranked using semantic,
      mass, and continuous-roughness similarity. Projected contact is intentionally
      withheld and was not used for ranking; do not infer or claim access to it.

      Explain how retrieved outcomes plus mass and roughness differences support the
      estimates. The supplied retrieval weights describe neighbor ranking, not a force
      equation. No calibrated physics estimate is available; do not invent one.

      '
    e6: 'E6 FULL SEMANTIC AND SENSOR-FUSION RETRIEVAL CONDITION.

      Use the object image, fixed gripper embodiment context, supplied authoritative

      mass, continuous roughness index, and projected contact fraction, plus one object
      list ranked using all four configured similarity terms.

      Explain how retrieved outcomes and the measured differences support the estimates.
      Treat projected contact fraction as a dimensionless contact proxy, not literal
      physical area. The supplied retrieval weights describe neighbor ranking, not a
      force equation. No calibrated physics estimate is available; do not invent one.

      '
  target_instructions:
    single: 'SINGLE-CANDIDATE OUTPUT CONDITION.

      Predict only the requested gripper''s minimum force and feasibility. Do not
      estimate

      the inactive gripper, compare grippers, or recommend an alternative. Return
      only the

      per-gripper JSON required by the supplied schema.

      '
    joint: 'JOINT-CANDIDATE OUTPUT CONDITION.

      Predict both requested grippers, compare their force and feasibility estimates,
      and

      return an explicit recommendation with the comparison evidence required by the
      schema.

      '
embodiments:
  gecko:
    description: Parallel-jaw gripper with two opposing, rigid fingers. One finger
      is stationary, while the other translates laterally toward it to close around
      an object positioned between them. Each finger carries an inward-facing, mushroom-tipped
      gecko-inspired dry-adhesive pad of length 4.2 inches mounted on a rigid backing.
      The fingers and adhesive backings remain rigid during grasping and do not conform
      to the object. Therefore, the maximum adhesion requires the object’s opposing
      sidewalls to be sufficiently flat, parallel, and aligned with the pads so that
      broad contact can form. Generally, the greater the adhesion, the lower the grasp
      force required to pick up the object. Dry adhesion performs best on clean, dry,
      smooth, nonporous surfaces and degrades with roughness, porosity, contamination,
      moisture, and loose coatings. On objects that are incompatible with dry adhesion,
      limited frictional support still applies; thus, the gecko-adhesive-based gripper
      can technically still grasp the objects; however, gecko should be fully avoided
      for greasy, dusty, and sharp objects.
  silicone:
    description: Parallel-jaw gripper with two opposing, rigid fingers. One finger
      is stationary, while the other translates laterally toward it to close around
      an object positioned between them. Each finger carries an inward-facing, non-adhesive,
      high-friction silicone pad of 4.2 inches in length mounted on a rigid backing.
      The fingers and backing do not flex or conform to the object, although the silicone
      surface may deform locally at the contact interface. Holding capacity arises
      mainly from normal force, friction, and the silicone pad’s viscoelastic interaction
      with the surface. The silicone pads are effective on rough, irregular, or interrupted
      surfaces, but performance still decreases when the contact area is small, the
      object is highly curved or misaligned, or the surface is wet, oily, or contaminated.
