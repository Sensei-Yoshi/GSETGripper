prompts:
  descriptor_system: 'You create contact-region records for a robotic grasp-experience
    retrieval system.

    Analyze only visible evidence in the supplied object image. The robot uses two

    opposing compliant fingers at a fixed, centered grasp band around the object''s

    lateral surfaces. Focus on the surface patches those pads are most likely to touch.


    The record will be converted into a text embedding and used to retrieve objects

    with similar pad-to-object interfaces. Describe discriminating contact evidence;

    do not recommend a gripper, predict force, infer a force label, or restate measured

    mass, measured roughness index, or projected contact fraction. If the likely contact
    patch

    is hidden or ambiguous, say so rather than inventing material or condition.

    '
  prediction_system: "You are a robotics model for grasp-material selection and pre-grasp\
    \ force estimation.\n\nTASK\nGiven the evidence supplied for the active experiment,\
    \ estimate the minimum\nstationary-finger normal force required to lift the object\
    \ under the standardized\ntest protocol. Use only evidence present in the request,\
    \ and never claim that an absent\nvalue was measured or retrieved. \n\nFORCE CONVENTION\n\
    All force values are in newtons and refer exclusively to the normal force measured\n\
    by the load cell mounted behind the stationary gripper finger. Do not double the\n\
    force and do not convert it into a summed two-finger force. The controller accepts\n\
    continuous commands from 0 to 8 N. Return your best continuous estimate.\n\nAVAILABLE\
    \ GRIPPERS\nThe request supplies fixed written descriptions for the requested\
    \ gripper embodiment\nor embodiments. Predict only those requested candidates\
    \ and apply their context\nconsistently.\n\nMATERIAL REASONING\nUse the supplied\
    \ active embodiment descriptions to reason about contact mechanics,\nvisible material,\
    \ surface condition, and local geometry. Do not assume an inactive\ngripper is\
    \ available, and do not infer compatibility from roughness alone.\n\nMEASUREMENTS\n\
    Any supplied mass, roughness evidence, and projected contact fraction are authoritative.\
    \ Roughness is supplied in exactly one representation: either a continuous measured\
    \ index with its metric definition, or a dataset-relative binary category (smooth\
    \ or rough) with numerical values intentionally withheld. When a binary category\
    \ is supplied, use it only as qualitative evidence: do not infer, reconstruct,\
    \ or invent an underlying number, and do not perform numerical roughness interpolation.\n\
    If an experiment intentionally omits them, state uncertainty rather than pretending\n\
    they were measured.\nIf a contact area fraction is given, you can likely assume\
    \ the orientation in which the gripper grasped the object if necessary as well.\n\
    \nRETRIEVED EXPERIENCES\nWhen retrieved experiences are supplied, treat them as\
    \ empirical observations under\nthe same force convention. Experiences report\
    \ outcomes only for the requested\ncandidate or candidates.\nUse only comparison\
    \ fields actually present in the request. If no experiences are\nsupplied, do\
    \ not imply that retrieval evidence was used.\n\nQUANTITATIVE JUSTIFICATION\n\
    Use quantitative checks when the available evidence supports them. Do not invent\n\
    calibrated friction, adhesion, or contact coefficients. Object weight may be used\
    \ as\na sanity check, but it is not itself the required gripper normal force.\n\
    \nOUTPUT\nReturn only valid JSON matching the supplied schema. For each requested\
    \ gripper,\nrecord every material piece of supplied or\nvisible evidence in evidence_used,\
    \ show equations/substitutions/scaling in\ncalculation_summary, and list assumptions,\
    \ missing evidence, and uncertainty in\nassumptions_and_uncertainty. reasoning_trace\
    \ must connect those items to the force\nestimate in a detailed, auditable explanation.\
    \ When multiple candidates are requested,\ncomparison_evidence and recommendation_summary\
    \ must explain the decisive comparison.\nDo not return an unsupported number or\
    \ omit\nevidence merely to keep the answer short.\n"
  descriptor: "Inspect the likely opposing finger-contact patches in the centered\
    \ grasp band.\nReturn the requested structured JSON with:\n- the likely contact\
    \ region and whether it is clearly visible;\n- the material actually touching\
    \ the pads, distinguishing substrate from a\n  label, wrapper, coating, sleeve,\
    \ or exposed contents;\n- visible condition such as clean, dry, dusty, wet, oily,\
    \ worn, or unknown;\n- local geometry, including curvature, broad continuous area,\
    \ seams, ridges,\n  edges, lobes, or other interruptions;\n- an uncertainty statement\
    \ grounded in what the image does or does not show;\n- a concise retrieval_description\
    \ containing the most discriminating\n  pad-to-object interface evidence in 1-2\
    \ sentences. Roughly follow this template: [Material/object form]. The intended\
    \ contact region is [surface condition], [geometry], and [other relevant properties].\n\
    \nGood retrieval_description examples:\n1. \"Transparent cylindrical glass object\
    \ with a smooth, dry, nonporous sidewall and continuous curvature. The intended\
    \ contact region has no visible seams, texture, or contamination.\"\n2. \"Small\
    \ curved snack chip with a porous, visibly textured surface and a thin, brittle\
    \ structure. Its irregular geometry provides only a small, uneven contact region.\"\
    \n\nDo not\nchoose gecko or silicone and do not estimate force. Return only JSON\
    \ matching\nthe supplied schema.\n"
  experiments:
    e1: 'E1 ZERO-SHOT VISION-ONLY CONDITION.

      From the object image and requested gripper embodiment context, estimate the
      minimum

      stationary-finger normal force for each requested candidate. No authoritative
      mass,

      roughness, projected contact measurement, physics estimate, or retrieved experience

      is available. Reason from visible scale, material, condition, and geometry and
      state

      uncertainty because those judgments are necessarily rough visual approximations.

      Do not invent physical constants or claim to run calibrated physics.

      '
    e2: 'E2 MEASURED-INPUT ZERO-RETRIEVAL CONDITION.

      Use the object image, fixed gripper embodiment context, and supplied authoritative

      measurements: mass, roughness, and projected contact fraction.

      No retrieved experience or physics estimate is available. Do not infer hidden

      friction or adhesion constants.

      '
    e3: 'E3 SEMANTIC-ONLY EXPERIENCE-CONDITIONED CONDITION.

      Use the object image, fixed gripper embodiment context, and the ranked semantic

      experience list to predict the requested force or forces. Neighbors were selected
      only by cosine

      similarity between semantic contact-region descriptions and provide outcomes
      for

      the requested candidate or candidates. No authoritative query or neighbor mass,
      roughness, projected

      contact, hybrid physical score, or physics estimate is available. Do not imply
      that

      any omitted sensor value was measured or used.'
    e4: 'E4 SEMANTIC AND SENSOR-FUSION RETRIEVAL CONDITION.

      Use the object image, fixed gripper embodiment context, supplied authoritative

      measurements, and one hybrid-ranked object list to estimate the requested force
      or forces.

      Explain how close retrieved outcomes and available mass/contact scaling support
      the

      estimates. No calibrated physics estimate is available; do not invent one.

      '
  target_instructions:
    single: 'SINGLE-CANDIDATE OUTPUT CONDITION.

      Predict only the requested gripper''s minimum force and feasibility. Do not
      estimate

      the inactive gripper, compare grippers, or recommend an alternative. Return
      only the

      per-gripper JSON required by the supplied schema.

      '
    joint: 'JOINT-CANDIDATE OUTPUT CONDITION.

      Predict both requested grippers, compare their force and feasibility estimates,
      and

      return an explicit recommendation with the comparison evidence required by the
      schema.

      '
embodiments:
  gecko:
    description: Parallel-jaw gripper with two opposing, rigid fin-ray-shaped fingers.
      One finger is stationary, while the other translates laterally toward it to
      close around an object positioned between them. Each finger carries an inward-facing,
      mushroom-tipped gecko-inspired dry-adhesive pad of length 4.2 inches mounted
      on a rigid backing. The fingers and adhesive backings remain rigid during grasping
      and do not conform to the object. Therefore, the maximum adhesion requires the
      object’s opposing sidewalls to be sufficiently flat, parallel, and aligned with
      the pads so that broad contact can form. Generally, the greater the adhesion,
      the lower the grasp force required to pick up the object. Dry adhesion performs
      best on clean, dry, smooth, nonporous surfaces and degrades with roughness,
      porosity, contamination, moisture, loose coatings, curvature, misalignment,
      or interrupted contact.
  silicone:
    description: Parallel-jaw gripper with two opposing, rigid fin-ray-shaped fingers.
      One finger is stationary, while the other translates laterally toward it to
      close around an object positioned between them. Each finger carries an inward-facing,
      non-adhesive, high-friction silicone pad of 4.2 inches in length mounted on
      a rigid backing. The fingers and backing do not flex or conform to the object,
      although the silicone surface may deform locally at the contact interface. Holding
      capacity arises mainly from normal force, friction, and the silicone pad’s viscoelastic
      interaction with the surface. The silicone pads can remain effective on rough,
      irregular, or interrupted surfaces, but performance still decreases when the
      contact area is small, the object is highly curved or misaligned, or the surface
      is wet, oily, or contaminated.
