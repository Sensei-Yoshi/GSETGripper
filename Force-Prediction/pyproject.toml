[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "force-prediction"
version = "0.1.0"
description = "Material-aware gripper selection and minimum-force prediction for gecko/silicone soft grippers"
requires-python = ">=3.11"
dependencies = [
    "numpy<2",
    "opencv-python<4.12",
    "pyserial>=3.5",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "tenacity>=8.2",
    "platformdirs>=4.0",
    "google-genai>=0.3",
]

[project.optional-dependencies]
segmentation = ["rembg[cpu]>=2.0.50"]
roughness = [
    "torch>=2.1",
    "torchvision>=0.16",
    "diffusers>=0.30",
    "transformers>=4.39",
    "accelerate>=0.28",
    "rembg[cpu]>=2.0.50",
]
viewer = ["streamlit>=1.40", "pandas>=2.0", "matplotlib>=3.8"]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.9", "types-PyYAML", "types-pyserial"]

[tool.setuptools.packages.find]
include = ["modules*", "streamlit_app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by formatter; long prompt strings allowed

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["gemini_integration: opt-in test that may call the Gemini API"]
